services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: chargeroad
      POSTGRES_USER: chargeroad
      POSTGRES_PASSWORD: chargeroad
    ports:
      - "5432:5432"
    volumes:
      - chargeroad-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargeroad -d chargeroad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chargeroad-db: